# Static server for reveal (nginx-unprivileged, listens on 8080).
# Security headers live in security-headers.inc and are only declared at server level:
# locations below use `expires` (not add_header) so the headers are inherited everywhere.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # No access log: the privacy note on the page promises it. Errors still go to stderr.
  access_log off;
  charset utf-8;
  include /etc/nginx/snippets/security-headers.inc;
  # Stops Cloudflare from rewriting responses, above all from injecting its Web Analytics beacon
  # (zone-wide setting): the page promises it contacts nobody. Joins the Cache-Control from `expires`.
  add_header Cache-Control "no-transform" always;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml text/tab-separated-values application/wasm application/json text/plain;

  location = / { expires -1; try_files /index.html =404; }
  location = /index.html { expires -1; }
  location /assets/ { expires 1y; }
  location /mediapipe/ { expires 30d; }
  location /models/ { expires 30d; }
  location /geo/ { default_type text/tab-separated-values; expires 7d; }
  location / { expires 1h; try_files $uri =404; }
}
